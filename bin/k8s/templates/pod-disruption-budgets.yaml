# PDBs with minAvailable=1 prevent Karpenter from voluntarily evicting
# single-replica services during node consolidation.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-{{ .Values.webserver.name }}
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-{{ .Values.webserver.name }}
---
