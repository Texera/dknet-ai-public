kubernetes {

  enabled = false
  enabled = ${?KUBERNETES_COMPUTING_UNIT_ENABLED}

  compute-unit-pool-name = "texera-workflow-computing-unit"
  compute-unit-pool-name = ${?KUBERNETES_COMPUTE_UNIT_POOL_NAME}

  compute-unit-pool-namespace = "texera-workflow-computing-unit-pool"
  compute-unit-pool-namespace = ${?KUBERNETES_COMPUTE_UNIT_POOL_NAMESPACE}

  compute-unit-service-name = "workflow-computing-unit-svc"
  compute-unit-service-name = ${?KUBERNETES_COMPUTE_UNIT_SERVICE_NAME}

  image-name = "bobbai/texera-workflow-computing-unit:dev"
  image-name = ${?KUBERNETES_IMAGE_NAME}

  image-pull-policy = "Always"
  image-pull-policy = ${?KUBERNETES_IMAGE_PULL_POLICY}

  port-num = 8085

  # Cap on simultaneously-active computing units per user across ALL types
  # (kubernetes / local / aws). Active = terminate_time IS NULL.
  max-num-of-running-computing-units-per-user = 1
  max-num-of-running-computing-units-per-user = ${?MAX_NUM_OF_RUNNING_COMPUTING_UNITS_PER_USER}

  # Number of computing units that fit on the always-on warm placeholder
  # capacity. The frontend uses this to warn that creating beyond it requires
  # provisioning a new node (~minutes). 0 disables the warning.
  warm-pool-capacity = 0
  warm-pool-capacity = ${?COMPUTING_UNIT_WARM_POOL_CAPACITY}

  computing-unit-cpu-limit-options = "1,2,4"
  computing-unit-cpu-limit-options = ${?KUBERNETES_COMPUTING_UNIT_CPU_LIMIT_OPTIONS}

  computing-unit-memory-limit-options = "1Gi,2Gi,4Gi"
  computing-unit-memory-limit-options = ${?KUBERNETES_COMPUTING_UNIT_MEMORY_LIMIT_OPTIONS}

  # A curated image is supplied by an administrator and reviewed by nobody, so units
  # started from one are pinned to a non-root user. runAsUser is stated too because
  # kubelet cannot verify an image whose USER is a name, which the Texera image's is.
  computing-unit-run-as-non-root = true
  computing-unit-run-as-non-root = ${?KUBERNETES_COMPUTING_UNIT_RUN_AS_NON_ROOT}

  # The uid the Texera computing-unit image creates. It must exist in the image.
  computing-unit-run-as-user = 1001
  computing-unit-run-as-user = ${?KUBERNETES_COMPUTING_UNIT_RUN_AS_USER}

  # GPU configuration
  computing-unit-gpu-limit-options = "0,1,2"
  computing-unit-gpu-limit-options = ${?KUBERNETES_COMPUTING_UNIT_GPU_LIMIT_OPTIONS}
  
  # GPU resource key used in Kubernetes (vendor-specific)
  computing-unit-gpu-resource-key = "nvidia.com/gpu"
  computing-unit-gpu-resource-key = ${?KUBERNETES_COMPUTING_UNIT_GPU_RESOURCE_KEY}

  # Optional: pin CU pods to a dedicated, tainted Karpenter NodePool so their
  # disruption policy (WhenEmpty) is isolated from shared nodes and persists.
  # See bin/k8s/utils/cu-nodepool.yaml. When the label key+value are set, the
  # cu-manager adds a matching nodeSelector to each CU pod; when the toleration
  # key is set, it adds a NoSchedule/Exists toleration for that taint.
  #
  # Leave all three EMPTY (default) to schedule CU pods on the cluster's default
  # pool — required for local/dev clusters that have no dedicated CU NodePool.
  compute-unit-node-selector-label = ""
  compute-unit-node-selector-label = ${?KUBERNETES_COMPUTE_UNIT_NODE_SELECTOR_LABEL}

  compute-unit-node-selector-value = ""
  compute-unit-node-selector-value = ${?KUBERNETES_COMPUTE_UNIT_NODE_SELECTOR_VALUE}

  compute-unit-toleration-key = ""
  compute-unit-toleration-key = ${?KUBERNETES_COMPUTE_UNIT_TOLERATION_KEY}
}

curated-images {
  # Off until the UI to manage these ships.
  enabled = false
  enabled = ${?TEXERA_CURATED_IMAGES_ENABLED}

  # Reads a manifest to check the start command and resolve the digest. No layers are
  # pulled, so this is a few kilobytes.
  validation-image = "quay.io/skopeo/stable:v1.16.1"
  validation-image = ${?TEXERA_CURATED_IMAGE_VALIDATION_IMAGE}

  # Where validation jobs run; must be the pool namespace, which the chart sets.
  validation-namespace = "texera-workflow-computing-unit-pool"
  validation-namespace = ${?TEXERA_CURATED_IMAGE_VALIDATION_NAMESPACE}

  # Generous, because the wait is on a registry answering.
  validation-timeout-seconds = 300
  validation-timeout-seconds = ${?TEXERA_CURATED_IMAGE_VALIDATION_TIMEOUT_SECONDS}

  # Reading a manifest is neither CPU nor memory work.
  validation-cpu-request = "100m"
  validation-cpu-request = ${?TEXERA_CURATED_IMAGE_VALIDATION_CPU_REQUEST}
  validation-memory-request = "128Mi"
  validation-memory-request = ${?TEXERA_CURATED_IMAGE_VALIDATION_MEMORY_REQUEST}
  validation-cpu-limit = "1"
  validation-cpu-limit = ${?TEXERA_CURATED_IMAGE_VALIDATION_CPU_LIMIT}
  validation-memory-limit = "256Mi"
  validation-memory-limit = ${?TEXERA_CURATED_IMAGE_VALIDATION_MEMORY_LIMIT}

  # Pull each ready image onto every node as soon as it is ready. Costs node disk, since
  # every node holds every ready image. Turning it off also removes the pre-pulls already
  # made, on the next read of the image list.
  prepull-enabled = true
  prepull-enabled = ${?TEXERA_CURATED_IMAGE_PREPULL_ENABLED}

  # The pool namespace. The release namespace holds the privileged mounter, where write
  # access to DaemonSets would mean root on every node.
  prepull-namespace = "texera-workflow-computing-unit-pool"
  prepull-namespace = ${?TEXERA_CURATED_IMAGE_PREPULL_NAMESPACE}

  # How long before a failed create is tried again. Without a pause, a failure that will
  # not clear is retried on every read of the image list, by every user.
  prepull-retry-cooldown-seconds = 300
  prepull-retry-cooldown-seconds = ${?TEXERA_CURATED_IMAGE_PREPULL_RETRY_COOLDOWN_SECONDS}

  # Holds the pod open once the image is pulled, so the node does not reclaim it.
  # registry.k8s.io is where the pause image now lives.
  prepull-pause-image = "registry.k8s.io/pause:3.9"
  prepull-pause-image = ${?TEXERA_CURATED_IMAGE_PREPULL_PAUSE_IMAGE}

  # The pause container does nothing but exist.
  prepull-cpu = "1m"
  prepull-cpu = ${?TEXERA_CURATED_IMAGE_PREPULL_CPU}
  prepull-memory = "8Mi"
  prepull-memory = ${?TEXERA_CURATED_IMAGE_PREPULL_MEMORY}
}
