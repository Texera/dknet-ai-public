kubernetes {

  enabled = false
  enabled = ${?KUBERNETES_COMPUTING_UNIT_ENABLED}

  compute-unit-pool-name = "texera-workflow-computing-unit"
  compute-unit-pool-name = ${?KUBERNETES_COMPUTE_UNIT_POOL_NAME}

  compute-unit-pool-namespace = "texera-workflow-computing-unit-pool"
  compute-unit-pool-namespace = ${?KUBERNETES_COMPUTE_UNIT_POOL_NAMESPACE}

  compute-unit-service-name = "workflow-computing-unit-svc"
  compute-unit-service-name = ${?KUBERNETES_COMPUTE_UNIT_SERVICE_NAME}

  image-name = "bobbai/texera-workflow-computing-unit:dev"
  image-name = ${?KUBERNETES_IMAGE_NAME}

  image-pull-policy = "Always"
  image-pull-policy = ${?KUBERNETES_IMAGE_PULL_POLICY}

  port-num = 8085

  # Cap on simultaneously-active computing units per user across ALL types
  # (kubernetes / local / aws). Active = terminate_time IS NULL.
  max-num-of-running-computing-units-per-user = 1
  max-num-of-running-computing-units-per-user = ${?MAX_NUM_OF_RUNNING_COMPUTING_UNITS_PER_USER}

  # Number of computing units that fit on the always-on warm placeholder
  # capacity. The frontend uses this to warn that creating beyond it requires
  # provisioning a new node (~minutes). 0 disables the warning.
  warm-pool-capacity = 0
  warm-pool-capacity = ${?COMPUTING_UNIT_WARM_POOL_CAPACITY}

  computing-unit-cpu-limit-options = "1,2,4"
  computing-unit-cpu-limit-options = ${?KUBERNETES_COMPUTING_UNIT_CPU_LIMIT_OPTIONS}

  computing-unit-memory-limit-options = "1Gi,2Gi,4Gi"
  computing-unit-memory-limit-options = ${?KUBERNETES_COMPUTING_UNIT_MEMORY_LIMIT_OPTIONS}

  # GPU configuration
  computing-unit-gpu-limit-options = "0,1,2"
  computing-unit-gpu-limit-options = ${?KUBERNETES_COMPUTING_UNIT_GPU_LIMIT_OPTIONS}
  
  # GPU resource key used in Kubernetes (vendor-specific)
  computing-unit-gpu-resource-key = "nvidia.com/gpu"
  computing-unit-gpu-resource-key = ${?KUBERNETES_COMPUTING_UNIT_GPU_RESOURCE_KEY}

  # Optional: pin CU pods to a dedicated, tainted Karpenter NodePool so their
  # disruption policy (WhenEmpty) is isolated from shared nodes and persists.
  # See bin/k8s/utils/cu-nodepool.yaml. When the label key+value are set, the
  # cu-manager adds a matching nodeSelector to each CU pod; when the toleration
  # key is set, it adds a NoSchedule/Exists toleration for that taint.
  #
  # Leave all three EMPTY (default) to schedule CU pods on the cluster's default
  # pool — required for local/dev clusters that have no dedicated CU NodePool.
  compute-unit-node-selector-label = ""
  compute-unit-node-selector-label = ${?KUBERNETES_COMPUTE_UNIT_NODE_SELECTOR_LABEL}

  compute-unit-node-selector-value = ""
  compute-unit-node-selector-value = ${?KUBERNETES_COMPUTE_UNIT_NODE_SELECTOR_VALUE}

  compute-unit-toleration-key = ""
  compute-unit-toleration-key = ${?KUBERNETES_COMPUTE_UNIT_TOLERATION_KEY}
}